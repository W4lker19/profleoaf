<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torres de cores</title>
<style>
  :root {
    --bg: #f4f7fb; --paper: #ffffff; --ink: #1b2a39; --muted: #586a7c; --line: #d3dfeb; --accent: #2a5d8f; --ok: #1f8a4c;
    --vermelho: #d7392b; --azul: #2b6fd7; --amarelo: #f5c518; --verde: #2ea043;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: Arial, Helvetica, sans-serif; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; touch-action: manipulation; overflow: hidden; }

  /* barra da professora: pequena, discreta */
  .barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; padding: 8px 12px; font-size: 14px; color: var(--muted); }
  .barra .grupo { display: flex; gap: 4px; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .barra .grupo span { padding: 0 6px; }
  .barra button { font: inherit; border: 0; background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 7px; cursor: pointer; }
  .barra button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .barra button:focus-visible, .cor:focus-visible, .mais:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }

  /* palco */
  .palco { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: clamp(24px, 8vw, 120px); padding: 8px 16px 0; min-height: 0; }
  .coluna { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .rotulo { font-size: clamp(16px, 2.4vw, 22px); font-weight: 700; color: var(--muted); }
  .torre { display: flex; flex-direction: column-reverse; align-items: center; justify-content: flex-start; width: var(--bw); min-height: calc(var(--bh) * 3 + 20px); padding-bottom: 6px; border-bottom: 8px solid #b8c6d6; }
  .palco.livre .torre { min-height: calc(var(--bh) * 5 + 20px); }
  .bloco { position: relative; width: var(--bw); height: var(--bh); border: 5px solid var(--ink); border-radius: 8px; margin-top: 14px; }
  .bloco::before, .bloco::after { content: ""; position: absolute; top: -17px; width: 22%; height: 14px; background: inherit; border: 5px solid var(--ink); border-bottom: 0; border-radius: 4px 4px 0 0; }
  .bloco::before { left: 15%; } .bloco::after { right: 15%; }
  .bloco.vazio { background: transparent !important; border-style: dashed; border-color: #b8c6d6; }
  .bloco.vazio::before, .bloco.vazio::after { display: none; }
  .bloco.novo { animation: cai .28s ease-out; }
  @keyframes cai { from { transform: translateY(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .torre.certo { animation: salta .5s ease-in-out 2; }
  @keyframes salta { 50% { transform: translateY(-14px); } }
  .seta { align-self: center; font-size: clamp(40px, 7vw, 80px); color: var(--muted); padding-bottom: calc(var(--bh) * 1.2); }

  /* zona de botões */
  .botoes { display: flex; justify-content: center; gap: clamp(14px, 3vw, 32px); padding: 20px 16px 28px; flex-wrap: wrap; }
  .cor { width: clamp(110px, 17vw, 190px); height: clamp(110px, 17vw, 190px); border-radius: 26px; border: 7px solid var(--ink); cursor: pointer; box-shadow: 0 8px 0 rgba(27,42,57,.25); transition: transform .08s; }
  .cor:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(27,42,57,.25); }
  .cor.abana { animation: abana .35s; }
  @keyframes abana { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  .mais { display: none; align-items: center; gap: 18px; font: 700 clamp(28px, 5vw, 48px) Arial, sans-serif; color: var(--ink); background: #fff1c2; border: 7px solid var(--ink); border-radius: 28px; padding: 18px 40px; cursor: pointer; box-shadow: 0 8px 0 rgba(27,42,57,.25); }
  .mais svg { width: 1.4em; height: 1.4em; }
  .mostra-mais .mais { display: inline-flex; }
  .mostra-mais .cor { display: none; }

  .festa { position: fixed; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; }
  .festa b { font-size: clamp(44px, 9vw, 110px); color: var(--ok); background: rgba(255,255,255,.9); border: 6px solid var(--ok); border-radius: 30px; padding: 10px 40px; opacity: 0; transform: scale(.6); transition: .25s; }
  .festa.on b { opacity: 1; transform: scale(1); }
  .estrela { position: absolute; font-size: 48px; animation: voa 1.1s ease-out forwards; }
  @keyframes voa { from { transform: translate(0,0) scale(.4); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .bloco.novo, .torre.certo, .cor.abana, .estrela { animation: none; } }
</style>
</head>
<body>
  <div class="barra" aria-label="Opções para a professora">
    <div class="grupo"><span>Modo</span><button data-modo="igual" aria-pressed="true">Faz igual</button><button data-modo="livre" aria-pressed="false">Livre</button></div>
    <div class="grupo" id="g-altura"><span>Torre</span><button data-altura="2" aria-pressed="true">2 blocos</button><button data-altura="3" aria-pressed="false">3 blocos</button></div>
    <div class="grupo" id="g-cores"><span>Cores</span><button data-cores="2" aria-pressed="true">2</button><button data-cores="4" aria-pressed="false">4</button></div>
    <div class="grupo"><button id="b-som" aria-pressed="true">Som</button><button id="b-limpar">Recomeçar</button></div>
  </div>

  <main class="palco" id="palco">
    <div class="coluna" id="col-modelo"><div class="torre" id="modelo" aria-label="Torre para copiar"></div><div class="rotulo">Esta</div></div>
    <div class="seta" id="seta" aria-hidden="true">→</div>
    <div class="coluna"><div class="torre" id="minha" aria-live="polite" aria-label="A tua torre"></div><div class="rotulo" id="rot-minha">A tua</div></div>
  </main>

  <div class="botoes" id="botoes">
    <button class="mais" id="b-mais"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#fff" stroke="#1b2a39" stroke-width="3"/><path d="M20 10v20M10 20h20" stroke="#1b2a39" stroke-width="5" stroke-linecap="round"/></svg>Mais</button>
  </div>
  <div class="festa" id="festa"><b>Muito bem!</b></div>

<script>
const CORES = ['vermelho', 'azul', 'amarelo', 'verde'];
const NOMES = { vermelho: 'vermelho', azul: 'azul', amarelo: 'amarelo', verde: 'verde' };
const st = { modo: 'igual', altura: 2, nCores: 2, som: true, modelo: [], minha: [], botoes: [], ocupado: false };
const $ = id => document.getElementById(id);
const baralha = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function falar(t) {
  if (!st.som || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t); u.lang = 'pt-PT'; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => v.lang === 'pt-PT') || speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('pt'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function tamanho() {
  const h = window.innerHeight, livre = st.modo === 'livre';
  const linhas = livre ? 5 : 3;
  const bh = Math.max(34, Math.min(80, (h - 330) / (linhas + 0.6)));
  document.documentElement.style.setProperty('--bh', bh + 'px');
  document.documentElement.style.setProperty('--bw', Math.round(bh * 1.9) + 'px');
}

function bloco(c, novo) { const d = document.createElement('div'); d.className = 'bloco' + (novo ? ' novo' : ''); if (c) d.style.background = `var(--${c})`; else d.classList.add('vazio'); return d; }

function desenhar(novo) {
  const m = $('modelo'), t = $('minha');
  m.innerHTML = ''; t.innerHTML = '';
  if (st.modo === 'igual') {
    st.modelo.forEach(c => m.appendChild(bloco(c)));
    st.minha.forEach((c, i) => t.appendChild(bloco(c, novo && i === st.minha.length - 1)));
    for (let i = st.minha.length; i < st.altura; i++) t.appendChild(bloco(null));
  } else {
    st.minha.forEach((c, i) => t.appendChild(bloco(c, novo && i === st.minha.length - 1)));
  }
}

function desenharBotoes() {
  const z = $('botoes');
  z.querySelectorAll('.cor').forEach(b => b.remove());
  st.botoes.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'cor'; b.style.background = `var(--${c})`; b.setAttribute('aria-label', NOMES[c]); b.dataset.cor = c; b.title = `${NOMES[c]} (tecla ${i + 1})`;
    b.addEventListener('click', () => escolher(c, b));
    z.insertBefore(b, $('b-mais'));
  });
}

function novaTorre() {
  st.minha = []; st.ocupado = false;
  document.body.classList.remove('mostra-mais'); $('minha').classList.remove('certo');
  if (st.modo === 'igual') {
    const pool = baralha(CORES).slice(0, st.nCores);
    let mod; do { mod = Array.from({ length: st.altura }, () => pool[Math.floor(Math.random() * pool.length)]); } while (new Set(mod).size < Math.min(2, st.nCores));
    st.modelo = mod;
    // os botões mostram as cores da torre; com "4", mostram as quatro
    const usadas = [...new Set(mod)];
    st.botoes = st.nCores === 4 ? baralha(CORES) : baralha(usadas.length >= 2 ? usadas : pool);
  } else {
    st.modelo = []; st.botoes = CORES.slice();
  }
  desenhar(false); desenharBotoes();
}

function escolher(c, btn) {
  if (st.ocupado) return;
  if (st.modo === 'igual') {
    const certa = st.modelo[st.minha.length];
    if (c !== certa) { btn.classList.remove('abana'); void btn.offsetWidth; btn.classList.add('abana'); return; }
    st.minha.push(c); desenhar(true); falar(NOMES[c]);
    if (st.minha.length === st.altura) { st.ocupado = true; setTimeout(festejar, 450); }
  } else {
    if (st.minha.length >= 5) st.minha = [];
    st.minha.push(c); desenhar(true); falar(NOMES[c]);
  }
}

function festejar() {
  $('minha').classList.add('certo');
  const f = $('festa'); f.classList.add('on'); falar('Muito bem!');
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('span'); s.className = 'estrela'; s.textContent = '★';
    s.style.color = ['#f5c518', '#2ea043', '#2b6fd7', '#d7392b'][i % 4];
    s.style.setProperty('--dx', (Math.cos(i / 14 * 6.28) * 260) + 'px'); s.style.setProperty('--dy', (Math.sin(i / 14 * 6.28) * 200) + 'px');
    f.appendChild(s); setTimeout(() => s.remove(), 1200);
  }
  setTimeout(() => { f.classList.remove('on'); document.body.classList.add('mostra-mais'); $('b-mais').focus({ preventScroll: true }); }, 1500);
}

function marcar(sel, attr, val) { document.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', String(b.dataset[attr] == val))); }

document.querySelectorAll('[data-modo]').forEach(b => b.addEventListener('click', () => {
  st.modo = b.dataset.modo; marcar('[data-modo]', 'modo', st.modo);
  const livre = st.modo === 'livre';
  $('palco').classList.toggle('livre', livre);
  $('col-modelo').style.display = $('seta').style.display = livre ? 'none' : '';
  $('g-altura').style.display = $('g-cores').style.display = livre ? 'none' : '';
  $('rot-minha').textContent = livre ? 'A minha torre' : 'A tua';
  tamanho(); novaTorre();
}));
document.querySelectorAll('[data-altura]').forEach(b => b.addEventListener('click', () => { st.altura = +b.dataset.altura; marcar('[data-altura]', 'altura', st.altura); novaTorre(); }));
document.querySelectorAll('[data-cores]').forEach(b => b.addEventListener('click', () => { st.nCores = +b.dataset.cores; marcar('[data-cores]', 'cores', st.nCores); novaTorre(); }));
$('b-som').addEventListener('click', () => { st.som = !st.som; $('b-som').setAttribute('aria-pressed', String(st.som)); });
$('b-limpar').addEventListener('click', () => { if (st.modo === 'livre') { st.minha = []; desenhar(false); } else novaTorre(); });
$('b-mais').addEventListener('click', novaTorre);
document.addEventListener('keydown', e => {
  if (document.body.classList.contains('mostra-mais') && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); novaTorre(); return; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= st.botoes.length) { const b = document.querySelector(`.cor[data-cor="${st.botoes[n - 1]}"]`); if (b) escolher(st.botoes[n - 1], b); }
});
window.addEventListener('resize', tamanho);
if ('speechSynthesis' in window) speechSynthesis.getVoices();
tamanho(); novaTorre();
</script>
</body>
</html>
