<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Resultados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Página do professor: palavra-passe, escolha da atividade e da turma, tabela por número com tentativas, copiar notas para o Excel */
:root {
  --bg: #eef3f8; --paper: #ffffff; --line: #c9d8e8; --ink: #1d2b3a; --muted: #5a6b7d;
  --accent: #2a5d8f; --accent-ink: #ffffff; --ok: #1f8a4c; --ok-bg: #e2f4e9; --bad: #b8432f; --bad-bg: #fbe5e2;
  --warn: #8a5a00; --warn-bg: #fff1cc;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif; --body: "Lexend", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111a24; --paper: #18232f; --line: #2c3c4d; --ink: #e6edf4; --muted: #9aabbd;
    --accent: #5b9bd5; --accent-ink: #0d1620; --ok: #5fd08f; --ok-bg: #173325; --bad: #ff8a7a; --bad-bg: #3a1d1a;
    --warn: #f5c533; --warn-bg: #3a2f10; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111a24; --paper: #18232f; --line: #2c3c4d; --ink: #e6edf4; --muted: #9aabbd;
  --accent: #5b9bd5; --accent-ink: #0d1620; --ok: #5fd08f; --ok-bg: #173325; --bad: #ff8a7a; --bad-bg: #3a1d1a;
  --warn: #f5c533; --warn-bg: #3a2f10; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 32px; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 16px; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 0; }
.card { background: var(--paper); border-radius: 16px; padding: 18px; display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
label { display: grid; gap: 4px; font-weight: 600; font-size: .9rem; }
input, select { font: 400 1rem var(--body); color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.btn { font: 600 .95rem var(--body); border-radius: 10px; padding: 10px 16px; border: 2px solid transparent; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.small { padding: 4px 10px; font-size: .82rem; }
.btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { font: 600 .95rem var(--body); border-radius: 99px; padding: 6px 14px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
.tab.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.msg { border-radius: 10px; padding: 10px 12px; font-size: .95rem; }
.msg.bad { background: var(--bad-bg); color: var(--bad); } .msg.ok { background: var(--ok-bg); color: var(--ok); } .msg.info { background: var(--bg); color: var(--muted); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .93rem; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
td.n { font-variant-numeric: tabular-nums; text-align: right; }
.nota { font-family: var(--display); font-weight: 600; font-size: 1.1rem; }
.muted { color: var(--muted); }
details summary { cursor: pointer; color: var(--accent); font-size: .85rem; }
.att { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .85rem; padding: 4px 0; border-top: 1px dashed var(--line); }
.stats { display: flex; flex-wrap: wrap; gap: 16px; font-size: .95rem; }
.stats b { font-family: var(--display); font-size: 1.3rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Resultados das atividades</h1>

  <section class="card" id="login">
    <div class="row">
      <label>Palavra-passe<input type="password" id="pw" autocomplete="current-password"></label>
      <label>Atividade<select id="ativ"><option value="missao-seguranca">Missão Segurança (TIC 7.º ano)</option></select></label>
      <button class="btn" id="entrar">Ver resultados</button>
    </div>
    <div id="estado" class="msg info" hidden></div>
  </section>

  <section class="card" id="painel" hidden>
    <div class="tabs" id="tabs"></div>
    <div class="stats" id="stats"></div>
    <div class="row">
      <label>Nota a usar<select id="modo"><option value="ultima">Última tentativa</option><option value="melhor">Melhor tentativa</option></select></label>
      <label>Alunos na turma<input type="number" id="nalunos" min="1" max="40" style="width:90px"></label>
      <button class="btn" id="copiar">Copiar notas para o Excel</button>
      <button class="btn ghost" id="csv">Descarregar CSV</button>
      <button class="btn ghost" id="atualizar">Atualizar</button>
    </div>
    <p class="muted" style="margin:0;font-size:.88rem">"Copiar notas" copia uma nota por linha, do n.º 1 ao último. No Excel, clica na célula do aluno n.º 1 na coluna da atividade e cola. Quem não fez fica com a linha em branco.</p>
    <div class="tablewrap"><table><thead><tr><th>N.º</th><th>Nome</th><th>Nota</th><th>Parte 1</th><th>Parte 2</th><th>Tentativas</th><th>Data</th></tr></thead><tbody id="tb"></tbody></table></div>
  </section>
</div>
<script>
const API = 'https://api.profleoaf.pt';
const TAMANHO = { '7.º C': 17, '7.º D': 18, '7.º E': 19, '7.º G': 21, '7.º H': 18 };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let dados = [], turma = null, chave = '';
try { chave = sessionStorage.getItem('rk') || ''; } catch (e) {}
if (chave) $('#pw').value = chave;

function estado(t, cls) { const e = $('#estado'); e.hidden = !t; e.className = 'msg ' + (cls || 'info'); e.textContent = t || ''; }

async function carregar() {
  chave = $('#pw').value; if (!chave) { estado('Escreve a palavra-passe.', 'bad'); return; }
  estado('A carregar…');
  try {
    const r = await fetch(API + '/resultados?atividade=' + encodeURIComponent($('#ativ').value), { headers: { Authorization: 'Bearer ' + chave } });
    if (r.status === 401) { estado('Palavra-passe errada.', 'bad'); return; }
    if (!r.ok) throw new Error(r.status);
    dados = (await r.json()).resultados || [];
    try { sessionStorage.setItem('rk', chave); } catch (e) {}
    estado(dados.length ? '' : 'Ainda não há resultados desta atividade.', 'info');
    $('#painel').hidden = false; desenhar();
  } catch (e) { estado('Não foi possível ligar ao serviço de resultados.', 'bad'); }
}

function porAluno(lista) {
  const m = new Map();
  lista.forEach(x => { if (!m.has(x.numero)) m.set(x.numero, []); m.get(x.numero).push(x); });
  return m;
}
function escolhida(tent) {
  return $('#modo').value === 'melhor' ? tent.reduce((a, b) => (b.nota > a.nota ? b : a)) : tent[tent.length - 1];
}

function desenhar() {
  const turmas = Object.keys(TAMANHO).concat([...new Set(dados.map(d => d.turma))].filter(t => !(t in TAMANHO)));
  if (!turma) turma = turmas.find(t => dados.some(d => d.turma === t)) || turmas[0];
  $('#tabs').innerHTML = turmas.map(t => `<button class="tab ${t === turma ? 'on' : ''}" data-t="${esc(t)}">${esc(t)} (${new Set(dados.filter(d => d.turma === t).map(d => d.numero)).size})</button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { turma = b.dataset.t; desenhar(); });
  if (!$('#nalunos').value || $('#nalunos').dataset.t !== turma) { $('#nalunos').value = TAMANHO[turma] || ''; $('#nalunos').dataset.t = turma; }
  const lista = dados.filter(d => d.turma === turma);
  const m = porAluno(lista);
  const nums = [...m.keys()].sort((a, b) => a - b);
  const notas = nums.map(n => escolhida(m.get(n)).nota);
  const media = notas.length ? Math.round(notas.reduce((a, b) => a + b, 0) / notas.length) : '–';
  $('#stats').innerHTML = `<span>Alunos com resultado: <b>${nums.length}</b>${TAMANHO[turma] ? ' de ' + TAMANHO[turma] : ''}</span><span>Média: <b>${media}</b></span>`;
  $('#tb').innerHTML = nums.map(n => {
    const t = m.get(n), e = escolhida(t);
    const nomes = [...new Set(t.map(x => x.nome))];
    const tent = t.map(x => `<div class="att"><span>${new Date(x.criado).toLocaleString('pt-PT')}</span><span>nota <b>${x.nota}</b> (P1 ${x.p1 ?? '–'}, P2 ${x.p2 ?? '–'})</span><span class="muted">${esc(x.nome)}</span><button class="btn small danger" data-id="${x.id}">Apagar</button></div>`).join('');
    return `<tr><td class="n">${n}</td><td>${esc(e.nome)}${nomes.length > 1 ? ' <span class="muted">(nomes diferentes nas tentativas)</span>' : ''}${t.length > 1 ? `<details><summary>ver tentativas</summary>${tent}</details>` : `<details><summary>opções</summary>${tent}</details>`}</td><td class="nota">${e.nota}</td><td class="n">${e.p1 ?? '–'}</td><td class="n">${e.p2 ?? '–'}</td><td class="n">${t.length}</td><td class="muted">${new Date(e.criado).toLocaleDateString('pt-PT')}</td></tr>`;
  }).join('') || '<tr><td colspan="7" class="muted">Sem resultados nesta turma.</td></tr>';
  $('#tb').querySelectorAll('[data-id]').forEach(b => b.onclick = () => apagar(+b.dataset.id));
}

async function apagar(id) {
  if (!confirm('Apagar este registo? Não dá para desfazer.')) return;
  const r = await fetch(API + '/resultado?id=' + id, { method: 'DELETE', headers: { Authorization: 'Bearer ' + chave } });
  if (r.ok) { dados = dados.filter(d => d.id !== id); desenhar(); } else alert('Não foi possível apagar.');
}

$('#copiar').onclick = async () => {
  const m = porAluno(dados.filter(d => d.turma === turma));
  const total = +$('#nalunos').value || Math.max(0, ...m.keys());
  const linhas = Array.from({ length: total }, (_, i) => m.has(i + 1) ? String(escolhida(m.get(i + 1)).nota) : '');
  try { await navigator.clipboard.writeText(linhas.join('\n')); alert(`Copiadas ${linhas.length} linhas da ${turma}. Cola na célula do aluno n.º 1.`); }
  catch (e) { prompt('Copia este texto (Ctrl + C):', linhas.join('\n')); }
};
$('#csv').onclick = () => {
  const head = 'turma;numero;nome;nota;parte1;parte2;data';
  const rows = dados.map(d => [d.turma, d.numero, '"' + String(d.nome).replace(/"/g, '""') + '"', d.nota, d.p1 ?? '', d.p2 ?? '', d.criado].join(';'));
  const blob = new Blob(['﻿' + [head, ...rows].join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = $('#ativ').value + '_resultados.csv'; a.click();
};
$('#modo').onchange = desenhar;
$('#entrar').onclick = carregar; $('#atualizar').onclick = carregar;
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') carregar(); });
</script>
</body>
</html>
