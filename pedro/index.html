<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torres de cores · Pedro</title>
<style>
  :root {
    --bg: #f4f7fb; --paper: #ffffff; --ink: #1b2a39; --muted: #586a7c; --line: #d3dfeb; --accent: #2a5d8f; --ok: #1f8a4c;
    --vermelho: #d7392b; --azul: #2b6fd7; --amarelo: #f5c518; --verde: #2ea043;
    --bh: 60px; --bw: 114px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: Arial, Helvetica, sans-serif; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; touch-action: manipulation; overflow: hidden; }

  /* barra da professora */
  .barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; font-size: 14px; color: var(--muted); }
  .contagem { margin-right: auto; font-size: 15px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; }
  .contagem b { color: var(--ink); }
  .barra .grupo { display: flex; gap: 4px; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .barra .grupo span { padding: 0 6px; }
  .barra button { font: inherit; border: 0; background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 7px; cursor: pointer; }
  .barra button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .barra button:focus-visible, .cor:focus-visible, .grande:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
  .so-igual, .so-padrao, .so-memoria, .so-livre { display: none !important; }
  body[data-modo="igual"] .so-igual, body[data-modo="memoria"] .so-memoria, body[data-modo="padrao"] .so-padrao, body[data-modo="livre"] .so-livre,
  body[data-modo="igual"] .so-torre, body[data-modo="memoria"] .so-torre { display: flex !important; }
  .so-torre { display: none !important; }

  /* palco */
  .palco { flex: 1; display: flex; align-items: flex-end; justify-content: center; gap: clamp(24px, 7vw, 110px); padding: 8px 16px 0; min-height: 0; }
  .coluna { display: flex; flex-direction: column; align-items: center; gap: 10px; position: relative; }
  .rotulo { font-size: clamp(16px, 2.4vw, 22px); font-weight: 700; color: var(--muted); }
  .torre { display: flex; flex-direction: column-reverse; align-items: center; width: var(--bw); padding-bottom: 6px; border-bottom: 8px solid #b8c6d6; position: relative; }
  .bloco { position: relative; width: var(--bw); height: var(--bh); border: 5px solid var(--ink); border-radius: 8px; margin-top: 14px; flex: none; }
  .bloco::before, .bloco::after { content: ""; position: absolute; top: -17px; width: 22%; height: 14px; background: inherit; border: 5px solid var(--ink); border-bottom: 0; border-radius: 4px 4px 0 0; }
  .bloco::before { left: 15%; } .bloco::after { right: 15%; }
  .bloco.vazio { background: transparent !important; border-style: dashed; border-color: #9fb1c4; }
  .bloco.vazio::before, .bloco.vazio::after { display: none; }
  .bloco.pergunta { display: flex; align-items: center; justify-content: center; font-size: calc(var(--bh) * .7); font-weight: 700; color: #9fb1c4; }
  .bloco.novo { animation: cai .28s ease-out; }
  @keyframes cai { from { transform: translateY(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .certo { animation: salta .5s ease-in-out 2; }
  @keyframes salta { 50% { transform: translateY(-14px); } }
  .seta { align-self: center; font-size: clamp(40px, 7vw, 80px); color: var(--muted); }

  /* tapar o modelo (memória) */
  .tapa { position: absolute; left: -14px; right: -14px; bottom: -6px; top: -24px; background: #dfe8f2; border: 5px solid #9fb1c4; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 72px; font-weight: 700; color: #7b8fa4; }
  .tempo { width: var(--bw); height: 10px; background: #dfe8f2; border-radius: 5px; overflow: hidden; }
  .tempo i { display: block; height: 100%; background: var(--accent); width: 100%; }

  /* padrão em fila */
  .fila { display: flex; align-items: flex-end; gap: calc(var(--bw) * .12); padding-bottom: 6px; border-bottom: 8px solid #b8c6d6; }

  /* botões do Pedro */
  .botoes { display: flex; justify-content: center; align-items: center; gap: clamp(14px, 3vw, 32px); padding: 22px 16px 28px; flex-wrap: wrap; }
  .cor { width: clamp(100px, 15vw, 180px); height: clamp(100px, 15vw, 180px); border-radius: 26px; border: 7px solid var(--ink); cursor: pointer; box-shadow: 0 8px 0 rgba(27,42,57,.25); transition: transform .08s; }
  .cor:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(27,42,57,.25); }
  .abana { animation: abana .35s; }
  @keyframes abana { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .grande { display: none; align-items: center; gap: 16px; font: 700 clamp(26px, 4.5vw, 46px) Arial, sans-serif; color: var(--ink); background: #fff1c2; border: 7px solid var(--ink); border-radius: 28px; padding: 16px 36px; cursor: pointer; box-shadow: 0 8px 0 rgba(27,42,57,.25); }
  .grande svg { width: 1.4em; height: 1.4em; }
  .grande.ver { background: #e6eefc; font-size: clamp(20px, 3vw, 30px); padding: 10px 22px; }
  .mostra-mais #b-mais { display: inline-flex; }
  .mostra-mais .cor, .mostra-mais #b-ver { display: none !important; }
  body[data-modo="memoria"][data-fase="fazer"] #b-ver { display: inline-flex; }
  .bloqueado .cor { opacity: .35; pointer-events: none; }

  .festa { position: fixed; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; }
  .festa b { font-size: clamp(44px, 9vw, 110px); color: var(--ok); background: rgba(255,255,255,.92); border: 6px solid var(--ok); border-radius: 30px; padding: 10px 40px; opacity: 0; transform: scale(.6); transition: .25s; }
  .festa.on b { opacity: 1; transform: scale(1); }
  .estrela { position: absolute; font-size: 48px; animation: voa 1.1s ease-out forwards; }
  @keyframes voa { from { transform: translate(0,0) scale(.4); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .bloco.novo, .certo, .abana, .estrela { animation: none; } }
</style>
</head>
<body data-modo="igual" data-fase="fazer">
  <div class="barra" aria-label="Opções para a professora">
    <div class="contagem" id="contagem" aria-live="polite"></div>
    <div class="grupo"><span>Modo</span>
      <button data-modo="igual" aria-pressed="true">Faz igual</button>
      <button data-modo="padrao" aria-pressed="false">Padrões</button>
      <button data-modo="memoria" aria-pressed="false">De memória</button>
      <button data-modo="livre" aria-pressed="false">Livre</button>
    </div>
    <div class="grupo so-torre"><span>Torre</span><button data-altura="2" aria-pressed="true">2</button><button data-altura="3" aria-pressed="false">3</button><button data-altura="4" aria-pressed="false">4</button></div>
    <div class="grupo so-padrao"><span>Padrão</span><button data-padrao="AB" aria-pressed="true">AB</button><button data-padrao="AAB" aria-pressed="false">AAB</button><button data-padrao="ABC" aria-pressed="false">ABC</button></div>
    <div class="grupo so-igual so-memoria so-padrao" id="g-cores"><span>Cores</span><button data-cores="2" aria-pressed="true">poucas</button><button data-cores="4" aria-pressed="false">todas</button></div>
    <div class="grupo"><button id="b-som" aria-pressed="true">Som</button><button id="b-limpar">Recomeçar</button></div>
  </div>

  <main class="palco" id="palco"></main>

  <div class="botoes" id="botoes">
    <button class="grande ver" id="b-ver"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M3 20 q17 -16 34 0 q-17 16 -34 0z" fill="#fff" stroke="#1b2a39" stroke-width="3"/><circle cx="20" cy="20" r="6" fill="#1b2a39"/></svg>Ver outra vez</button>
    <button class="grande" id="b-mais"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#fff" stroke="#1b2a39" stroke-width="3"/><path d="M20 10v20M10 20h20" stroke="#1b2a39" stroke-width="5" stroke-linecap="round"/></svg>Mais</button>
  </div>
  <div class="festa" id="festa"><b>Muito bem!</b></div>

<script>
const CORES = ['vermelho', 'azul', 'amarelo', 'verde'];
const st = { modo: 'igual', altura: 2, padrao: 'AB', nCores: 2, som: true, alvo: [], minha: [], botoes: [], ocupado: false, errou: false, espreitou: 0, timer: null,
  stats: { igual: [0, 0], padrao: [0, 0], memoria: [0, 0] } };
const NOME_MODO = { igual: 'Faz igual', padrao: 'Padrões', memoria: 'De memória' };
const $ = id => document.getElementById(id);
const baralha = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const el = (cls, html) => { const d = document.createElement('div'); d.className = cls; if (html) d.innerHTML = html; return d; };

function falar(t) {
  if (!st.som || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t); u.lang = 'pt-PT'; u.rate = 0.9;
    const vs = speechSynthesis.getVoices(); const v = vs.find(v => v.lang === 'pt-PT') || vs.find(v => v.lang && v.lang.startsWith('pt'));
    if (v) u.voice = v; speechSynthesis.speak(u);
  } catch (e) {}
}

function tamanho() {
  const h = window.innerHeight, w = window.innerWidth;
  let bh, bw;
  if (st.modo === 'padrao') { bw = Math.min(120, (w - 80) / 7.2); bh = bw * .55; }
  else { const linhas = st.modo === 'livre' ? 6 : Math.max(3, st.altura); bh = Math.max(30, Math.min(78, (h - 340) / (linhas + .4) - 14)); bw = bh * 1.9; }
  document.documentElement.style.setProperty('--bh', bh + 'px');
  document.documentElement.style.setProperty('--bw', Math.round(bw) + 'px');
}

function bloco(c, extra) { const d = el('bloco' + (extra ? ' ' + extra : '')); if (c) d.style.background = `var(--${c})`; else d.classList.add('vazio'); return d; }

function contagem() {
  const s = st.stats[st.modo];
  $('contagem').innerHTML = s ? `${NOME_MODO[st.modo]}: <b>${s[0]}</b> feitas · <b>${s[1]}</b> à primeira` : 'Livre';
}

function desenhar(novo) {
  const p = $('palco'); p.innerHTML = '';
  if (st.modo === 'padrao') {
    const col = el('coluna'), fila = el('fila');
    st.alvo.forEach((c, i) => {
      if (i < st.mostrar) fila.appendChild(bloco(c));
      else if (st.minha[i - st.mostrar]) fila.appendChild(bloco(st.minha[i - st.mostrar], novo ? 'novo' : ''));
      else { const b = bloco(null, 'pergunta'); b.textContent = '?'; fila.appendChild(b); }
    });
    fila.id = 'minha'; col.appendChild(fila); col.appendChild(el('rotulo', 'O que vem a seguir?')); p.appendChild(col);
    return;
  }
  if (st.modo === 'livre') {
    const col = el('coluna'), t = el('torre'); t.id = 'minha';
    st.minha.forEach((c, i) => t.appendChild(bloco(c, novo && i === st.minha.length - 1 ? 'novo' : '')));
    t.style.minHeight = `calc((var(--bh) + 14px) * 6 + 6px)`;
    col.appendChild(t); col.appendChild(el('rotulo', 'A minha torre')); p.appendChild(col); return;
  }
  // igual / memória
  const alt = `calc((var(--bh) + 14px) * ${st.altura} + 6px)`;
  const cm = el('coluna'), m = el('torre'); m.style.minHeight = alt;
  st.alvo.forEach(c => m.appendChild(bloco(c)));
  cm.appendChild(m);
  if (st.modo === 'memoria') {
    if (document.body.dataset.fase === 'fazer' && !document.body.classList.contains('mostra-mais')) m.appendChild(el('tapa', '?'));
    if (document.body.dataset.fase === 'ver') { const t = el('tempo', '<i id="barra-tempo"></i>'); cm.appendChild(t); }
  }
  cm.appendChild(el('rotulo', st.modo !== 'memoria' ? 'Esta' : document.body.dataset.fase === 'ver' ? 'Olha bem' : 'Lembras-te?'));
  const ct = el('coluna'), t = el('torre'); t.id = 'minha'; t.style.minHeight = alt;
  st.minha.forEach((c, i) => t.appendChild(bloco(c, novo && i === st.minha.length - 1 ? 'novo' : '')));
  for (let i = st.minha.length; i < st.altura; i++) t.appendChild(bloco(null));
  ct.appendChild(t); ct.appendChild(el('rotulo', 'A tua'));
  p.appendChild(cm); p.appendChild(el('seta', '→')); p.appendChild(ct);
}

function desenharBotoes() {
  const z = $('botoes');
  z.querySelectorAll('.cor').forEach(b => b.remove());
  st.botoes.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'cor'; b.style.background = `var(--${c})`; b.setAttribute('aria-label', c); b.dataset.cor = c; b.title = `${c} (tecla ${i + 1})`;
    b.addEventListener('click', () => escolher(c, b));
    z.insertBefore(b, $('b-ver'));
  });
}

function gerarPadrao() {
  const n = st.padrao.length; // AB=2, AAB=3, ABC=3
  const cores = baralha(CORES);
  const mapa = { A: cores[0], B: cores[1], C: cores[2] };
  const unidade = st.padrao.split('').map(l => mapa[l]);
  const total = n === 2 ? 6 : 7;               // AB: A B A B A ?  ·  AAB/ABC: 2 unidades + 1
  const seq = Array.from({ length: total }, (_, i) => unidade[i % n]);
  st.alvo = seq; st.mostrar = total - 1;
  const usadas = [...new Set(unidade)];
  st.botoes = st.nCores === 4 ? baralha(CORES) : baralha(usadas.length >= 3 ? usadas : usadas.concat(cores.find(c => !usadas.includes(c))));
}

function novaRonda() {
  clearTimeout(st.timer);
  st.minha = []; st.ocupado = false; st.errou = false; st.espreitou = 0;
  document.body.classList.remove('mostra-mais', 'bloqueado');
  document.body.dataset.fase = 'fazer';
  if (st.modo === 'padrao') gerarPadrao();
  else if (st.modo === 'livre') { st.alvo = []; st.botoes = CORES.slice(); }
  else {
    const pool = baralha(CORES).slice(0, Math.max(st.nCores, Math.min(3, st.altura)));
    let mod; do { mod = Array.from({ length: st.altura }, () => pool[Math.floor(Math.random() * pool.length)]); } while (new Set(mod).size < 2);
    st.alvo = mod;
    const usadas = [...new Set(mod)];
    st.botoes = st.nCores === 4 ? baralha(CORES) : baralha(usadas);
  }
  tamanho(); desenhar(false); desenharBotoes(); contagem();
  if (st.modo === 'memoria') mostrarModelo();
}

function mostrarModelo() {
  const ms = 1500 + 1000 * st.altura;
  document.body.dataset.fase = 'ver'; document.body.classList.add('bloqueado');
  desenhar(false);
  const b = $('barra-tempo');
  if (b) { b.style.transition = 'none'; b.style.width = '100%'; void b.offsetWidth; b.style.transition = `width ${ms}ms linear`; b.style.width = '0%'; }
  st.timer = setTimeout(() => { document.body.dataset.fase = 'fazer'; document.body.classList.remove('bloqueado'); desenhar(false); }, ms);
}

function escolher(c, btn) {
  if (st.ocupado || document.body.classList.contains('bloqueado')) return;
  if (st.modo === 'livre') {
    if (st.minha.length >= 6) st.minha = [];
    st.minha.push(c); desenhar(true); falar(c); return;
  }
  const idx = st.modo === 'padrao' ? st.mostrar + st.minha.length : st.minha.length;
  if (c !== st.alvo[idx]) { st.errou = true; btn.classList.remove('abana'); void btn.offsetWidth; btn.classList.add('abana'); return; }
  st.minha.push(c); desenhar(true); falar(c);
  const falta = st.modo === 'padrao' ? st.alvo.length - st.mostrar - st.minha.length : st.altura - st.minha.length;
  if (falta === 0) { st.ocupado = true; setTimeout(festejar, 450); }
}

function festejar() {
  const s = st.stats[st.modo]; s[0]++; if (!st.errou && !st.espreitou) s[1]++; contagem();
  document.body.classList.add('mostra-mais'); desenhar(false);
  const m = $('minha'); if (m) m.classList.add('certo');
  document.body.classList.remove('mostra-mais');
  const f = $('festa'); f.classList.add('on'); falar('Muito bem!');
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('span'); s.className = 'estrela'; s.textContent = '★';
    s.style.color = ['#f5c518', '#2ea043', '#2b6fd7', '#d7392b'][i % 4];
    s.style.setProperty('--dx', (Math.cos(i / 14 * 6.28) * 260) + 'px'); s.style.setProperty('--dy', (Math.sin(i / 14 * 6.28) * 200) + 'px');
    f.appendChild(s); setTimeout(() => s.remove(), 1200);
  }
  setTimeout(() => { f.classList.remove('on'); novaRonda(); }, 1700);
}

function marcar(attr, val) { document.querySelectorAll(`[data-${attr}]`).forEach(b => { if (b.tagName === 'BUTTON') b.setAttribute('aria-pressed', String(b.dataset[attr] == val)); }); }

document.querySelectorAll('button[data-modo]').forEach(b => b.addEventListener('click', () => { st.modo = b.dataset.modo; document.body.dataset.modo = st.modo; marcar('modo', st.modo); novaRonda(); }));
document.querySelectorAll('button[data-altura]').forEach(b => b.addEventListener('click', () => { st.altura = +b.dataset.altura; marcar('altura', st.altura); novaRonda(); }));
document.querySelectorAll('button[data-padrao]').forEach(b => b.addEventListener('click', () => { st.padrao = b.dataset.padrao; marcar('padrao', st.padrao); novaRonda(); }));
document.querySelectorAll('button[data-cores]').forEach(b => b.addEventListener('click', () => { st.nCores = +b.dataset.cores; marcar('cores', st.nCores); novaRonda(); }));
$('b-som').addEventListener('click', () => { st.som = !st.som; $('b-som').setAttribute('aria-pressed', String(st.som)); });
$('b-limpar').addEventListener('click', () => { if (st.modo === 'livre') { st.minha = []; desenhar(false); } else novaRonda(); });
$('b-mais').addEventListener('click', novaRonda);
$('b-ver').addEventListener('click', () => { st.espreitou++; mostrarModelo(); });
document.addEventListener('keydown', e => {
  if (document.body.classList.contains('mostra-mais') && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); novaRonda(); return; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= st.botoes.length) { const b = document.querySelector(`.cor[data-cor="${st.botoes[n - 1]}"]`); if (b) escolher(st.botoes[n - 1], b); }
});
window.addEventListener('resize', () => { tamanho(); });
if ('speechSynthesis' in window) speechSynthesis.getVoices();
novaRonda();
</script>
</body>
</html>
