<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O carro inteligente · Pedro</title>
<script>document.write('<script src="/atividades.js?v=' + Math.floor(Date.now() / 60000) + '"><\/script>');</script>
<style>
  :root { --bg: #f4f7fb; --paper: #fff; --ink: #1b2a39; --muted: #586a7c; --line: #d3dfeb; --accent: #2a5d8f; --ok: #1f8a4c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: Arial, Helvetica, sans-serif; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; touch-action: manipulation; overflow: hidden; }
  .barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; font-size: 14px; color: var(--muted); }
  .contagem { margin-right: auto; font-size: 15px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; }
  .contagem b { color: var(--ink); }
  .grupo { display: flex; gap: 4px; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .grupo span { padding: 0 6px; }
  .barra button, .barra a { font: inherit; border: 0; background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 7px; cursor: pointer; text-decoration: none; }
  .barra button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  button:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }

  .cena { flex: 0 0 auto; margin: 0 16px; border: 5px solid var(--ink); border-radius: 20px; overflow: hidden; background: #cfe8f7; position: relative; }
  .cena svg { display: block; width: 100%; height: auto; }
  .pergunta { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 6px 18px; font-size: clamp(18px, 2.4vw, 28px); font-weight: 700; white-space: nowrap; }
  .msg { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: #fff3cd; border: 3px solid #b8860b; border-radius: 14px; padding: 6px 16px; font-size: clamp(16px, 2vw, 22px); font-weight: 700; display: none; white-space: nowrap; }
  .msg.on { display: block; }

  .zona { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 18px; padding: 12px 16px 18px; flex-wrap: wrap; }
  .acao { width: clamp(130px, 17vw, 200px); height: clamp(110px, 15vh, 150px); border: 6px solid var(--ink); border-radius: 24px; background: #fff; cursor: pointer; box-shadow: 0 7px 0 rgba(27,42,57,.25); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 700 clamp(18px, 2.2vw, 26px) Arial, sans-serif; color: var(--ink); padding: 6px; }
  .acao svg { width: 54%; height: 54%; }
  .acao:active { transform: translateY(4px); box-shadow: 0 3px 0 rgba(27,42,57,.25); }
  .acao:disabled { opacity: .5; }
  .acao.abana { animation: abana .35s; }
  @keyframes abana { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  /* regras */
  .regras { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .regra { display: flex; align-items: center; gap: 10px; background: #fff; border: 5px solid var(--ink); border-radius: 20px; padding: 8px 12px; }
  .regra.erro { border-color: #d7392b; background: #fde4e1; }
  .regra .se { font-weight: 700; font-size: 18px; color: var(--muted); }
  .regra .sensor { width: 80px; height: 80px; }
  .regra .seta { font-size: 30px; font-weight: 700; color: var(--muted); }
  .regra .escolha { width: 110px; height: 96px; border: 4px dashed #9fb1c4; border-radius: 16px; background: #f4f7fb; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font: 700 15px Arial, sans-serif; color: var(--ink); padding: 4px; }
  .regra .escolha.feita { border-style: solid; border-color: var(--ink); background: #fff1c2; }
  .regra .escolha svg { width: 48px; height: 48px; }
  .testar { font: 700 clamp(22px, 2.6vw, 32px) Arial, sans-serif; background: #9be0b4; border: 6px solid var(--ink); border-radius: 22px; padding: 14px 30px; cursor: pointer; box-shadow: 0 7px 0 rgba(27,42,57,.25); }
  .testar:disabled { opacity: .45; }

  /* semáforo */
  .slots { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; justify-content: center; }
  .slot { display: flex; flex-direction: column; align-items: center; gap: 6px; background: #fff; border: 5px solid var(--ink); border-radius: 20px; padding: 8px 12px; }
  .slot.erro { border-color: #d7392b; background: #fde4e1; }
  .slot b { font-size: 16px; color: var(--muted); }
  .luz { width: 92px; height: 92px; border-radius: 50%; border: 6px solid var(--ink); cursor: pointer; background: #e9eef3; font: 700 34px Arial; color: #9fb1c4; display: flex; align-items: center; justify-content: center; }
  .peaoBtn { width: 92px; height: 64px; border-radius: 14px; border: 4px solid var(--ink); cursor: pointer; background: #e9eef3; display: flex; align-items: center; justify-content: center; gap: 4px; font: 700 13px Arial; color: var(--ink); }
  .peaoBtn svg { width: 30px; height: 40px; }
  .seg { font-size: 34px; font-weight: 700; color: var(--muted); align-self: center; }
  @media (max-height: 680px) { .luz { width: 70px; height: 70px; } .peaoBtn { height: 52px; } .slot { padding: 4px 8px; } }
  /* escolher carro */
  .inicio { position: fixed; inset: 0; background: rgba(244,247,251,.97); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; z-index: 10; }
  .inicio h1 { margin: 0; font-size: clamp(28px, 4vw, 44px); }
  .inicio .cores { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
  .inicio button { width: clamp(150px, 18vw, 220px); height: clamp(110px, 14vw, 160px); border: 6px solid var(--ink); border-radius: 26px; background: #fff; cursor: pointer; box-shadow: 0 7px 0 rgba(27,42,57,.25); padding: 8px; }
  .inicio button svg { width: 100%; height: 100%; }
  .inicio.fechado { display: none; }

  @media (max-height: 780px) {
    .regras { gap: 8px; } .regra { padding: 4px 8px; gap: 6px; border-width: 4px; } .regra .sensor { width: 58px; height: 58px; }
    .regra .escolha { width: 84px; height: 70px; } .regra .escolha svg { width: 36px; height: 36px; } .regra .seta { font-size: 22px; }
    .testar { padding: 8px 22px; } .zona { gap: 10px; padding: 8px 12px 10px; } .barra { padding: 4px 10px; gap: 4px; }
  }
  .festa { position: fixed; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; z-index: 5; }
  .festa b { font-size: clamp(44px, 9vw, 110px); color: var(--ok); background: rgba(255,255,255,.93); border: 6px solid var(--ok); border-radius: 30px; padding: 10px 40px; opacity: 0; transform: scale(.6); transition: .25s; }
  .festa.on b { opacity: 1; transform: scale(1); }
  .estrela { position: absolute; font-size: 48px; animation: voa 1.1s ease-out forwards; }
  @keyframes voa { from { transform: translate(0,0) scale(.4); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; } }
</style>
</head>
<body data-modo="regras">
  <div class="barra" aria-label="Opções para a professora">
    <div class="contagem" id="contagem"></div>
    <div class="grupo"><span>Atividade</span><button data-modo="regras" aria-pressed="true">Regras do carro</button><button data-modo="erro" aria-pressed="false">Encontra o erro</button><button data-modo="semaforo" aria-pressed="false">Programa o semáforo</button></div>
    <div class="grupo"><span>Nível</span><button data-nivel="1" aria-pressed="true">1</button><button data-nivel="2" aria-pressed="false">2</button><button data-nivel="3" aria-pressed="false">3</button></div>
    <div class="grupo"><button id="b-som" aria-pressed="true">Som</button><button id="b-carro">Mudar carro</button><button id="b-novo">Outra</button><a href="/pedro/">← Início</a></div>
  </div>
  <div class="cena" id="cena"><div id="svg"></div><div class="pergunta" id="pergunta"></div><div class="msg" id="msg"></div></div>
  <div class="zona" id="zona"></div>
  <div class="inicio" id="inicio"><h1>Escolhe o teu carro</h1><div class="cores" id="cores"></div></div>
  <div class="festa" id="festa"><b>Muito bem!</b></div>

<script>
const COR = { vermelho: '#d7392b', azul: '#2b6fd7', amarelo: '#f5c518', verde: '#2ea043' };
// sensores: o que o carro vê; a ação certa
const SENS = {
  verde:    { nome: 'semáforo verde', certa: 'andar', aviso: '' },
  vermelho: { nome: 'semáforo vermelho', certa: 'parar', aviso: 'Está vermelho! O carro tem de parar.' },
  peao:     { nome: 'peão na passadeira', certa: 'parar', aviso: 'Há uma pessoa a passar! O carro tem de parar.' },
  livre:    { nome: 'passadeira livre', certa: 'andar', aviso: 'A passadeira está livre. O carro pode andar.' },
  cone:     { nome: 'cone na estrada', certa: 'contornar', aviso: 'Há um cone! O carro tem de contornar.' },
  gasolina: { nome: 'sem gasolina', certa: 'abastecer', aviso: 'O carro está sem gasolina!' },
};
const ACOES = { andar: 'Andar', parar: 'Parar', contornar: 'Contornar', abastecer: 'Gasolina' };
const NIVEL = {
  1: { sens: ['verde', 'vermelho', 'peao', 'cone', 'gasolina'], acoes: ['andar', 'parar', 'contornar', 'abastecer'], eventos: 5 },
  2: { sens: ['verde', 'vermelho', 'peao', 'livre', 'cone', 'gasolina'], acoes: ['andar', 'parar', 'contornar', 'abastecer'], eventos: 6, todos: true },
  3: { sens: ['verde', 'vermelho', 'peao', 'livre', 'cone', 'gasolina'], acoes: ['andar', 'parar', 'contornar', 'abastecer'], eventos: 7, todos: true },
};
const st = { modo: 'regras', nivel: 1, som: true, cor: 'azul', ocupado: false, errou: false, ultimo: null, stats: { decidir: [0, 0], regras: [0, 0], erro: [0, 0], semaforo: [0, 0] }, regras: {}, estrada: [] };
const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const espera = ms => new Promise(r => setTimeout(r, ms));

// ---------- desenhos (originais) ----------
const carroSVG = (c, x = 0, y = 0, s = 1) => `<g transform="translate(${x},${y}) scale(${s})">
  <path d="M-58 18 v-20 q0 -8 8 -9 l18 -3 l16 -20 q4 -5 11 -5 h30 q7 0 11 6 l14 19 l14 3 q8 2 8 10 v19 z" fill="${COR[c]}" stroke="#1b2a39" stroke-width="5" stroke-linejoin="round"/>
  <path d="M-24 -13 l12 -15 h14 v15 z M8 -13 v-15 h17 l11 15 z" fill="#cfe8f7" stroke="#1b2a39" stroke-width="4" stroke-linejoin="round"/>
  <rect x="44" y="-6" width="10" height="7" rx="2" fill="#ffe58a" stroke="#1b2a39" stroke-width="3"/>
  <circle cx="-30" cy="20" r="14" fill="#33404d" stroke="#1b2a39" stroke-width="5"/><circle cx="-30" cy="20" r="5" fill="#c9d3dd"/>
  <circle cx="32" cy="20" r="14" fill="#33404d" stroke="#1b2a39" stroke-width="5"/><circle cx="32" cy="20" r="5" fill="#c9d3dd"/></g>`;
const semaforoSVG = (cor, x) => `<g transform="translate(${x},0)"><rect x="-5" y="120" width="10" height="72" fill="#5b6672"/>
  <rect x="-24" y="52" width="48" height="96" rx="10" fill="#1b2a39"/>
  <circle cx="0" cy="76" r="13" fill="${cor === 'vermelho' ? '#ff3b2f' : '#4a2a28'}"/><circle cx="0" cy="100" r="${cor === 'amarelo' ? 13 : 9}" fill="${cor === 'amarelo' ? '#ffc21a' : '#4a4128'}"/><circle cx="0" cy="124" r="13" fill="${cor === 'verde' ? '#35d05a' : '#24402b'}"/></g>`;
const passadeiraSVG = (x, peao) => `<g transform="translate(${x},0)">${[0, 1, 2, 3, 4].map(i => `<rect x="-36" y="${196 + i * 14}" width="72" height="8" fill="#fff"/>`).join('')}
  ${peao ? `<g transform="translate(0,150)" class="peao"><circle cx="0" cy="-14" r="11" fill="#f2c894" stroke="#1b2a39" stroke-width="3"/><path d="M-12 30 l4 -34 h16 l4 34 M-10 46 l4 -16 M10 46 l-4 -16" fill="#7a4fb5" stroke="#1b2a39" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/></g>` : ''}</g>`;
const coneSVG = x => `<g transform="translate(${x},212)"><rect x="-26" y="22" width="52" height="9" rx="3" fill="#e8692c" stroke="#1b2a39" stroke-width="3"/><path d="M-14 22 L-4 -30 h8 L14 22 z" fill="#e8692c" stroke="#1b2a39" stroke-width="3" stroke-linejoin="round"/><path d="M-9 0 h18 l2 8 h-22 z" fill="#fff"/></g>`;
const bombaSVG = x => `<g transform="translate(${x},96)"><rect x="-22" y="0" width="44" height="80" rx="8" fill="#2a5d8f" stroke="#1b2a39" stroke-width="4"/><rect x="-14" y="10" width="28" height="18" rx="3" fill="#fff"/><path d="M22 20 h8 a5 5 0 0 1 5 5 v30 a4 4 0 0 0 8 0 V26 l-6 -8" fill="none" stroke="#1b2a39" stroke-width="4" stroke-linecap="round"/><path d="M0 40 c-6 8 -6 14 0 14 c6 0 6 -6 0 -14z" fill="#f5c518" stroke="#1b2a39" stroke-width="2"/><rect x="-28" y="78" width="56" height="8" rx="2" fill="#1b2a39"/></g>`;
const garagemSVG = (x, c) => `<g transform="translate(${x},96)"><path d="M-50 40 L0 0 L50 40 V100 H-50 Z" fill="${COR[c]}" stroke="#1b2a39" stroke-width="5" stroke-linejoin="round"/><rect x="-32" y="46" width="64" height="54" fill="#fff" stroke="#1b2a39" stroke-width="4"/><path d="M-32 60 H32 M-32 74 H32 M-32 88 H32" stroke="#9fb1c4" stroke-width="3"/></g>`;
const iconeAcao = { andar: '<svg viewBox="0 0 100 100"><path d="M10 40 H60 V20 L92 50 L60 80 V60 H10 Z" fill="#2ea043" stroke="#1b2a39" stroke-width="5" stroke-linejoin="round"/></svg>',
  parar: '<svg viewBox="0 0 100 100"><path d="M32 6 H68 L94 32 V68 L68 94 H32 L6 68 V32 Z" fill="#d7392b" stroke="#1b2a39" stroke-width="5"/><rect x="24" y="44" width="52" height="12" rx="3" fill="#fff"/></svg>',
  contornar: '<svg viewBox="0 0 100 100"><path d="M8 78 H30 Q40 78 44 66 L52 34 Q56 22 68 22 H74 V8 L96 30 L74 52 V38 H68 Q66 38 65 42 L58 70 Q52 94 30 94 H8 Z" fill="#2b6fd7" stroke="#1b2a39" stroke-width="4" stroke-linejoin="round"/></svg>',
  abastecer: '<svg viewBox="0 0 100 100"><rect x="18" y="10" width="44" height="80" rx="8" fill="#2a5d8f" stroke="#1b2a39" stroke-width="5"/><rect x="26" y="20" width="28" height="18" rx="3" fill="#fff"/><path d="M62 30 h10 a6 6 0 0 1 6 6 v30 a5 5 0 0 0 10 0 V36 l-8 -10" fill="none" stroke="#1b2a39" stroke-width="5" stroke-linecap="round"/><path d="M40 52 c-7 9 -7 15 0 15 c7 0 7 -6 0 -15z" fill="#f5c518" stroke="#1b2a39" stroke-width="2.5"/></svg>' };
function sensorMini(k) {
  const inner = { verde: semaforoSVG('verde', 50).replace('translate(50,0)', 'translate(50,-40) scale(.9)'), vermelho: semaforoSVG('vermelho', 50).replace('translate(50,0)', 'translate(50,-40) scale(.9)'),
    peao: `<g transform="translate(50,0)"><rect x="-44" y="64" width="88" height="36" fill="#5b6672"/>${[0, 1, 2].map(i => `<rect x="-36" y="${70 + i * 10}" width="72" height="6" fill="#fff" stroke="#9fb1c4" stroke-width="1"/>`).join('')}<g transform="translate(0,34) scale(.85)"><circle cx="0" cy="-14" r="11" fill="#f2c894" stroke="#1b2a39" stroke-width="3"/><path d="M-12 30 l4 -34 h16 l4 34 M-10 46 l4 -16 M10 46 l-4 -16" fill="#7a4fb5" stroke="#1b2a39" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/></g></g>`,
    livre: `<g transform="translate(50,0)"><rect x="-44" y="50" width="88" height="50" fill="#5b6672"/>${[0, 1, 2, 3].map(i => `<rect x="-30" y="${56 + i * 11}" width="60" height="6" fill="#fff"/>`).join('')}</g>`,
    cone: coneSVG(50).replace('translate(50,212)', 'translate(50,62) scale(1.3)'), gasolina: `<g transform="translate(50,50)"><rect x="-34" y="-20" width="68" height="40" rx="8" fill="#fff" stroke="#1b2a39" stroke-width="4"/><path d="M-24 10 A26 26 0 0 1 24 10" fill="none" stroke="#9fb1c4" stroke-width="6"/><path d="M0 12 L-20 -2" stroke="#d7392b" stroke-width="5" stroke-linecap="round"/><text x="-27" y="16" font-size="12" font-weight="700" fill="#d7392b" font-family="Arial">V</text></g>` }[k];
  return `<svg class="sensor" viewBox="0 0 100 100" aria-label="${SENS[k].nome}">${inner}</svg>`;
}
const W = 1000, H = 300;
function estradaBase(extra) {
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><rect width="${W}" height="${H}" fill="#cfe8f7"/><rect y="160" width="${W}" height="${H - 160}" fill="#9fc79a"/>
    <rect y="190" width="${W}" height="80" fill="#5b6672"/><path d="M0 230 H${W}" stroke="#fff" stroke-width="5" stroke-dasharray="34 26"/>${extra}<g id="carro"></g><g id="deposito"></g></svg>`;
}

// ---------- som ----------
function falar(t) { if (!st.som || !('speechSynthesis' in window)) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'pt-PT'; u.rate = .9; const vs = speechSynthesis.getVoices(); const v = vs.find(v => v.lang === 'pt-PT') || vs.find(v => v.lang && v.lang.startsWith('pt')); if (v) u.voice = v; speechSynthesis.speak(u); } catch (e) {} }
let ac = null;
function buzina() { if (!st.som) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); [0, .22].forEach(t0 => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'square'; o.frequency.value = 440; g.gain.setValueAtTime(0, ac.currentTime + t0); g.gain.linearRampToValueAtTime(.12, ac.currentTime + t0 + .02); g.gain.linearRampToValueAtTime(0, ac.currentTime + t0 + .16); o.connect(g); g.connect(ac.destination); o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + .18); }); } catch (e) {} }

// ---------- carro ----------
const car = { x: 80, y: 0 };
function desenharCarro() { const g = document.getElementById('carro'); if (g) g.innerHTML = carroSVG(st.cor, car.x, 222 + car.y, .9); }
function deposito(vazio) { const g = document.getElementById('deposito'); if (!g) return; g.innerHTML = vazio === null ? '' : `<g transform="translate(${car.x},150)"><rect x="-30" y="-18" width="60" height="30" rx="8" fill="#fff" stroke="#1b2a39" stroke-width="3"/><rect x="-22" y="-9" width="${vazio ? 6 : 44}" height="12" rx="3" fill="${vazio ? '#d7392b' : '#2ea043'}"/></g>`; }
async function mover(ate, dy = 0, ms = 700) {
  const x0 = car.x, y0 = car.y, t0 = performance.now();
  await new Promise(res => { const f = t => { const k = Math.min(1, (t - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; car.x = x0 + (ate - x0) * e; car.y = y0 + (dy - y0) * e; desenharCarro(); if (document.getElementById('deposito').innerHTML) deposito(st.vazio); k < 1 ? requestAnimationFrame(f) : res(); }; requestAnimationFrame(f); });
}
async function abanar() { const x = car.x; for (const d of [-8, 8, -5, 0]) { car.x = x + d; desenharCarro(); await espera(70); } }
function mensagem(t) { const m = $('msg'); if (!t) { m.classList.remove('on'); return; } m.textContent = t; m.classList.add('on'); }

// executa a ação certa de um evento a partir da posição atual; ex = posição x do evento
async function fazer(sens, ex) {
  if (sens === 'verde' || sens === 'livre') { await mover(ex + 90, 0, 900); }
  else if (sens === 'vermelho') { await mover(ex - 85, 0, 700); await espera(700); trocar(ex, 'semaforo', 'verde'); await espera(500); await mover(ex + 90, 0, 700); }
  else if (sens === 'peao') { await mover(ex - 95, 0, 700); const p = document.querySelector(`[data-ev="${ex}"] .peao`); if (p) { p.style.transition = 'transform 1s, opacity 1s'; p.style.transform = 'translate(0px,150px) translateY(-60px)'; p.style.opacity = '0'; } await espera(1100); await mover(ex + 90, 0, 700); }
  else if (sens === 'cone') { await mover(ex - 110, 0, 600); await mover(ex - 40, -42, 500); await mover(ex + 50, -42, 500); await mover(ex + 110, 0, 500); }
  else if (sens === 'gasolina') { await mover(ex - 5, 0, 800); await espera(300); for (let i = 0; i <= 4; i++) { st.vazio = i < 4; deposito(true); const r = document.querySelector('#deposito rect:nth-child(2)'); if (r) { r.setAttribute('width', 6 + i * 9.5); r.setAttribute('fill', i < 4 ? '#f5c518' : '#2ea043'); } await espera(220); } st.vazio = false; await espera(300); deposito(null); await mover(ex + 90, 0, 600); }
}
function trocar(ex, tipo, cor) { const g = document.querySelector(`[data-ev="${ex}"]`); if (g && tipo === 'semaforo') g.innerHTML = semaforoSVG(cor, 0).replace('translate(0,0)', ''); }
function eventoSVG(s, x) {
  const inner = { verde: semaforoSVG('verde', 0), vermelho: semaforoSVG('vermelho', 0), peao: passadeiraSVG(0, true), livre: passadeiraSVG(0, false), cone: coneSVG(0), gasolina: bombaSVG(0) }[s].replace(/^<g transform="translate\(0,0\)">/, '<g>');
  return `<g data-ev="${x}" transform="translate(${x},0)">${inner}</g>`;
}

// ---------- modo 1: o que faz o carro? ----------
function novaDecisao() {
  const L = NIVEL[st.nivel]; let s; do { s = L.sens[rnd(L.sens.length)]; } while (s === st.ultimo && L.sens.length > 1);
  st.ultimo = s; st.sens = s; st.errou = false; st.ocupado = false; mensagem('');
  const ex = 560; st.ex = ex;
  $('svg').innerHTML = estradaBase(eventoSVG(s, ex));
  car.x = 110; car.y = 0; desenharCarro(); st.vazio = s === 'gasolina'; deposito(s === 'gasolina' ? true : null);
  $('pergunta').textContent = 'O que faz o carro?';
  const z = $('zona'); z.innerHTML = L.acoes.map(a => `<button class="acao" data-a="${a}">${iconeAcao[a]}<span>${ACOES[a]}</span></button>`).join('');
  z.querySelectorAll('.acao').forEach(b => b.addEventListener('click', () => escolherAcao(b.dataset.a, b)));
  contagem(); setTimeout(() => falar('O que faz o carro?'), 300);
}
async function escolherAcao(a, btn) {
  if (st.ocupado) return;
  if (a !== SENS[st.sens].certa) { st.errou = true; btn.classList.remove('abana'); void btn.offsetWidth; btn.classList.add('abana'); await abanar(); const t = SENS[st.sens].aviso || 'Olha outra vez!'; mensagem(t); falar(t); return; }
  st.ocupado = true; mensagem(''); document.querySelectorAll('.acao').forEach(b => b.disabled = true); falar(ACOES[a] + '!');
  await fazer(st.sens, st.ex); await mover(1080, 0, 700);
  festejar(novaDecisao);
}

// ---------- modo 2: regras do carro ----------
function novaEstrada() {
  const L = NIVEL[st.nivel], n = L.eventos;
  let lista;
  for (let t = 0; t < 500; t++) {
    let base = L.todos ? L.sens.slice() : [];
    while (base.length < n) base.push(L.sens[rnd(L.sens.length)]);
    lista = base.sort(() => Math.random() - .5);
    const dif = new Set(lista).size, seguidos = lista.some((x, i) => i && lista[i - 1] === x);
    if (!seguidos && dif >= Math.min(4, L.sens.length)) break;
  }
  st.estrada = lista; st.errou = false; st.ocupado = false; mensagem('');
  const tipos = [...new Set(lista)]; st.regras = {}; tipos.forEach(t => st.regras[t] = null);
  if (st.modo === 'erro') {
    tipos.forEach(t => st.regras[t] = SENS[t].certa);
    const nErr = st.nivel === 1 ? 1 : 2, alvo = tipos.slice().sort(() => Math.random() - .5).slice(0, nErr);
    alvo.forEach(t => { const outras = L.acoes.filter(a => a !== SENS[t].certa); st.regras[t] = outras[rnd(outras.length)]; });
  }
  desenharEstrada(); desenharRegras(); contagem();
  $('pergunta').textContent = st.modo === 'erro' ? (st.nivel === 1 ? 'Há uma regra errada. Encontra-a!' : 'Há duas regras erradas. Encontra-as!') : 'Escolhe o que o carro faz em cada caso';
  setTimeout(() => falar(st.modo === 'erro' ? 'Há regras erradas. Encontra-as.' : 'Escolhe o que o carro faz.'), 300);
}
function posicoes() { const n = st.estrada.length, x0 = 200, x1 = 830; return st.estrada.map((_, i) => Math.round(x0 + (x1 - x0) * (n === 1 ? .5 : i / (n - 1)))); }
function desenharEstrada() {
  const xs = posicoes();
  $('svg').innerHTML = estradaBase(st.estrada.map((s, i) => eventoSVG(s, xs[i])).join('') + garagemSVG(935, st.cor));
  car.x = 70; car.y = 0; desenharCarro(); st.vazio = st.estrada.includes('gasolina'); deposito(st.vazio ? true : null);
}
function desenharRegras() {
  const L = NIVEL[st.nivel], z = $('zona');
  z.innerHTML = `<div class="regras">${Object.keys(st.regras).map(t => `<div class="regra" data-t="${t}"><span class="se">Se</span>${sensorMini(t)}<span class="seta">→</span>
    <button class="escolha${st.regras[t] ? ' feita' : ''}" data-t="${t}" aria-label="Ação para ${SENS[t].nome}">${st.regras[t] ? iconeAcao[st.regras[t]] + `<span>${ACOES[st.regras[t]]}</span>` : '<span style="font-size:34px">?</span>'}</button></div>`).join('')}</div>
    <button class="testar" id="b-testar">▶ Testar</button>`;
  z.querySelectorAll('.escolha').forEach(b => b.addEventListener('click', () => { if (st.ocupado) return; const t = b.dataset.t, i = L.acoes.indexOf(st.regras[t]); st.regras[t] = L.acoes[(i + 1) % L.acoes.length]; falar(ACOES[st.regras[t]]); desenharRegras(); }));
  $('b-testar').disabled = Object.values(st.regras).some(v => !v);
  $('b-testar').addEventListener('click', testar);
}
async function testar() {
  if (st.ocupado) return; st.ocupado = true; mensagem(''); desenharEstrada(); $('b-testar').disabled = true;
  document.querySelectorAll('.regra').forEach(r => r.classList.remove('erro'));
  const xs = posicoes();
  for (let i = 0; i < st.estrada.length; i++) {
    const s = st.estrada[i], ex = xs[i], a = st.regras[s];
    if (a !== SENS[s].certa) {
      // o carro faz a ação errada até ao ponto do problema e para
      await mover(ex - 100, 0, 700); await abanar();
      st.errou = true; document.querySelector(`.regra[data-t="${s}"]`).classList.add('erro');
      const t = SENS[s].aviso || 'Esta regra não está certa.'; mensagem(t); falar(t);
      await espera(1600); desenharEstrada(); st.ocupado = false; $('b-testar').disabled = false; return;
    }
    await fazer(s, ex);
  }
  await mover(935, 0, 700);
  festejar(novaEstrada);
}

// ---------- modo 3: programa o semáforo ----------
const LUZES = ['verde', 'amarelo', 'vermelho'], SEGUINTE = { verde: 'amarelo', amarelo: 'vermelho', vermelho: 'verde' };
const NOMELUZ = { verde: 'verde', amarelo: 'amarelo', vermelho: 'vermelho' };
const peaoLuz = (c, x) => `<g transform="translate(${x},0)" id="pluz"><rect x="-4" y="120" width="8" height="72" fill="#5b6672"/><rect x="-18" y="72" width="36" height="62" rx="8" fill="#1b2a39"/>
  <circle cx="0" cy="90" r="11" fill="${c === 'vermelho' ? '#ff3b2f' : '#4a2a28'}"/><circle cx="0" cy="116" r="11" fill="${c === 'verde' ? '#35d05a' : '#24402b'}"/></g>`;
const bonecoSVG = c => `<svg viewBox="0 0 30 40"><circle cx="15" cy="7" r="5" fill="${c}"/><path d="M9 38 l3 -14 l-4 -8 h14 l-4 8 l3 14" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function novoSemaforo() {
  st.seq = [null, null, null]; st.pseq = [null, null, null]; st.errou = false; st.ocupado = false; mensagem('');
  desenharSemaforo(null, null); desenharSlots(); contagem();
  $('pergunta').textContent = st.nivel === 1 ? 'Põe as cores do semáforo pela ordem certa' : 'Programa o semáforo dos carros e o dos peões';
  setTimeout(() => falar('Programa o semáforo.'), 300);
}
function desenharSemaforo(cor, pcor) {
  $('svg').innerHTML = estradaBase(passadeiraSVG(620, false) + semaforoSVG(cor || 'nenhum', 520) + (st.nivel >= 2 ? peaoLuz(pcor || 'nenhum', 720) : '') +
    `<g id="pessoa" transform="translate(620,0)"><g transform="translate(0,150)"><circle cx="0" cy="-14" r="11" fill="#f2c894" stroke="#1b2a39" stroke-width="3"/><path d="M-12 30 l4 -34 h16 l4 34 M-10 46 l4 -16 M10 46 l-4 -16" fill="#7a4fb5" stroke="#1b2a39" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/></g></g>`);
  car.x = 90; car.y = 0; desenharCarro(); deposito(null);
}
function desenharSlots() {
  const z = $('zona');
  z.innerHTML = `<div class="slots">${st.seq.map((c, i) => `${i ? '<span class="seg">→</span>' : ''}<div class="slot" data-i="${i}"><b>${i + 1}.º</b>
    <button class="luz" data-i="${i}" style="${c ? `background:${{ verde: '#35d05a', amarelo: '#ffc21a', vermelho: '#ff3b2f' }[c]};color:#1b2a39` : ''}" aria-label="Luz ${i + 1}">${c ? '' : '?'}</button>
    ${st.nivel >= 2 ? `<button class="peaoBtn" data-i="${i}" aria-label="Peões ${i + 1}">${st.pseq[i] ? bonecoSVG(st.pseq[i] === 'verde' ? '#2ea043' : '#d7392b') + (st.pseq[i] === 'verde' ? 'passa' : 'espera') : 'peões ?'}</button>` : ''}</div>`).join('')}</div>
    <button class="testar" id="b-testar">▶ Testar</button>`;
  z.querySelectorAll('.luz').forEach(b => b.addEventListener('click', () => { if (st.ocupado) return; const i = +b.dataset.i; st.seq[i] = st.seq[i] ? LUZES[(LUZES.indexOf(st.seq[i]) + 1) % 3] : 'verde'; falar(NOMELUZ[st.seq[i]]); desenharSlots(); }));
  z.querySelectorAll('.peaoBtn').forEach(b => b.addEventListener('click', () => { if (st.ocupado) return; const i = +b.dataset.i; st.pseq[i] = st.pseq[i] === 'verde' ? 'vermelho' : 'verde'; falar(st.pseq[i] === 'verde' ? 'Peões passam' : 'Peões esperam'); desenharSlots(); }));
  $('b-testar').disabled = st.seq.some(c => !c) || (st.nivel >= 2 && st.pseq.some(c => !c));
  $('b-testar').addEventListener('click', testarSemaforo);
}
function erroSemaforo() {
  const sq = st.seq;
  if (new Set(sq).size < 3) { const i = sq.findIndex((c, k) => sq.indexOf(c) !== k); return [i, 'Cada cor aparece só uma vez.']; }
  for (let i = 1; i < 3; i++) if (sq[i] !== SEGUINTE[sq[i - 1]]) return [i, `Depois do ${NOMELUZ[sq[i - 1]]} vem o ${NOMELUZ[SEGUINTE[sq[i - 1]]]}.`];
  if (st.nivel >= 2) for (let i = 0; i < 3; i++) {
    if (st.pseq[i] === 'verde' && sq[i] !== 'vermelho') return [i, 'Os peões só passam quando os carros têm vermelho.'];
    if (st.pseq[i] === 'vermelho' && sq[i] === 'vermelho') return [i, 'Com vermelho para os carros, os peões podem passar.'];
  }
  return null;
}
async function testarSemaforo() {
  if (st.ocupado) return; st.ocupado = true; $('b-testar').disabled = true; mensagem('');
  document.querySelectorAll('.slot').forEach(x => x.classList.remove('erro'));
  const err = erroSemaforo(), ate = err ? err[0] : 3;
  for (let i = 0; i < ate; i++) {
    const c = st.seq[i]; desenharSemaforo(c, st.nivel >= 2 ? st.pseq[i] : null); document.querySelector(`.slot[data-i="${i}"]`).style.outline = '5px solid #2a5d8f';
    if (c === 'verde') { await mover(1080, 0, 1500); }
    else if (c === 'amarelo') { await mover(430, 0, 1500); }
    else { car.x = 430; desenharCarro(); await espera(400); if (st.nivel >= 2 && st.pseq[i] === 'verde') { const g = document.querySelector('#pessoa g'); g.style.transform = 'translate(0px,150px)'; g.style.transition = 'transform 1.4s'; void g.getBoundingClientRect(); requestAnimationFrame(() => { g.style.transform = 'translate(0px,270px)'; }); } await espera(1500); }
    document.querySelector(`.slot[data-i="${i}"]`).style.outline = '';
  }
  if (err) {
    st.errou = true; desenharSemaforo(st.seq[err[0]], st.nivel >= 2 ? st.pseq[err[0]] : null); await abanar();
    document.querySelector(`.slot[data-i="${err[0]}"]`).classList.add('erro'); mensagem(err[1]); falar(err[1]);
    st.ocupado = false; $('b-testar').disabled = false; return;
  }
  festejar(novoSemaforo);
}

// ---------- comum ----------
function contagem() { const s = st.stats[st.modo]; $('contagem').innerHTML = `${{ regras: 'Regras do carro', erro: 'Encontra o erro', semaforo: 'Programa o semáforo' }[st.modo]} · nível ${st.nivel}: <b>${s[0]}</b> feitas · <b>${s[1]}</b> à primeira`; }
function festejar(seguinte) {
  const s = st.stats[st.modo]; s[0]++; if (!st.errou) s[1]++; contagem(); buzina();
  const f = $('festa'); f.classList.add('on'); setTimeout(() => falar('Muito bem!'), 350);
  for (let i = 0; i < 14; i++) { const e = document.createElement('span'); e.className = 'estrela'; e.textContent = '★'; e.style.color = ['#f5c518', '#2ea043', '#2b6fd7', '#d7392b'][i % 4]; e.style.setProperty('--dx', (Math.cos(i / 14 * 6.28) * 260) + 'px'); e.style.setProperty('--dy', (Math.sin(i / 14 * 6.28) * 200) + 'px'); f.appendChild(e); setTimeout(() => e.remove(), 1200); }
  setTimeout(() => { f.classList.remove('on'); seguinte(); }, 1700);
}
function comecar() { if (st.modo === 'semaforo' && st.nivel > 2) { st.nivel = 2; marcar('nivel', 2); } ajustar(); if (st.modo === 'decidir') novaDecisao(); else if (st.modo === 'semaforo') novoSemaforo(); else novaEstrada(); }
function marcar(attr, val) { document.querySelectorAll(`button[data-${attr}]`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset[attr] == val))); }
document.querySelectorAll('button[data-modo]').forEach(b => b.addEventListener('click', () => { st.modo = b.dataset.modo; document.body.dataset.modo = st.modo; marcar('modo', st.modo); comecar(); }));
document.querySelectorAll('button[data-nivel]').forEach(b => b.addEventListener('click', () => { st.nivel = +b.dataset.nivel; marcar('nivel', st.nivel); comecar(); }));
$('b-som').addEventListener('click', () => { st.som = !st.som; $('b-som').setAttribute('aria-pressed', String(st.som)); });
$('b-novo').addEventListener('click', () => { if (!st.ocupado) comecar(); });
$('b-carro').addEventListener('click', () => $('inicio').classList.remove('fechado'));
$('cores').innerHTML = Object.keys(COR).map(c => `<button data-cor="${c}" aria-label="Carro ${c}"><svg viewBox="-70 -45 140 80">${carroSVG(c)}</svg></button>`).join('');
$('cores').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { st.cor = b.dataset.cor; $('inicio').classList.add('fechado'); falar('Vamos!'); comecar(); }));
function ajustar() { const h = window.innerHeight, w = Math.min(window.innerWidth - 32, (h * (st.modo !== 'decidir' ? (h < 680 ? .30 : h < 780 ? .36 : .40) : .48)) * (W / H)); $('cena').style.width = w + 'px'; $('cena').style.margin = '0 auto'; }
window.addEventListener('resize', ajustar); ajustar();
if ('speechSynthesis' in window) speechSynthesis.getVoices();
comecar();
</script>
</body>
